// Privacy Browser trusted developer overlay. First line is skipped by AutoConfig.
(function () {
  const { classes: Cc, interfaces: Ci, manager: Cm } = Components;
  const location = Services.dirsvc.get("GreD", Ci.nsIFile);
  location.append("distribution"); location.append("privacybrowser");
  location.append("chrome.manifest");
  Cm.QueryInterface(Ci.nsIComponentRegistrar).autoRegister(location);
  const defaults = Services.prefs.getDefaultBranch("");
  Services.scriptloader.loadSubScript("resource://privacybrowser/defaults.js", {
    pref(name, value) {
      if (typeof value === "boolean") defaults.setBoolPref(name, value);
      else if (typeof value === "number") defaults.setIntPref(name, value);
      else defaults.setStringPref(name, value);
    }
  });
  const start = () => {
    try {
      ChromeUtils.importESModule("resource://privacybrowser/BrowserGlue.sys.mjs").startup();
    } catch (error) { Cu.reportError("Privacy Browser initialization failed: " + error); }
  };
  Services.obs.addObserver(function profileReady() {
    Services.obs.removeObserver(profileReady, "final-ui-startup"); start();
  }, "final-ui-startup");
})();
