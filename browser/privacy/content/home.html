<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src chrome:; style-src chrome:; img-src chrome:; form-action https:; base-uri 'none'; object-src 'none'">
  <title>Privacy Browser — New tab</title>
  <link rel="icon" href="chrome://privacybrowser/skin/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="chrome://privacybrowser/skin/page.css">
  <script type="module" src="chrome://privacybrowser/content/home.mjs"></script>
</head>
<body class="home-page">
  <header class="home-header"><a class="wordmark" href="chrome://privacybrowser/content/home.html"><img src="chrome://privacybrowser/skin/logo.svg" alt="" width="30" height="30">Privacy Browser</a><a class="quiet-link" href="chrome://privacybrowser/content/settings.html">Settings <span aria-hidden="true">↗</span></a></header>
  <main class="home-main">
    <div class="home-emblem" aria-hidden="true"><img src="chrome://privacybrowser/skin/logo.svg" width="64" height="64" alt=""></div>
    <p class="eyebrow">YOUR SPACE ON THE WEB</p>
    <h1>A little more privacy.<br>A lot more possibility.</h1>
    <form id="search-form" class="search-form" role="search">
      <label class="visually-hidden" for="search-input">Search the web</label>
      <svg class="search-symbol" width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="search-input" name="q" type="search" placeholder="Search with Brave Search" autocomplete="off" spellcheck="false" autofocus>
      <button class="search-submit" type="submit" aria-label="Search"><span aria-hidden="true">→</span></button>
    </form>
    <p class="search-caption">Search in this box. Enter website addresses in the address bar.</p>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <div class="privacy-state"><span class="state-dot" aria-hidden="true"></span><span id="history-label">Zero History</span><span class="state-divider" aria-hidden="true"></span><span id="engine-name">Brave Search</span></div>
  </main>
  <footer class="home-footer"><span>Privacy Browser <span class="muted">0.1.0 · Development</span></span><a href="chrome://privacybrowser/content/settings.html#privacy">Your privacy controls</a></footer>
</body>
</html>
