name: Code quality and cross-platform unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned source-branding test dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-build.txt
      - name: Parse Windows build and installer test scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tools -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error -Message $_.Message -ErrorAction Continue }
              $failed = $true
            }
          }
          if ($failed) { throw 'PowerShell syntax validation failed.' }
      - name: Syntax and portable unit tests
        shell: bash
        run: |
          python tools/check_source.py
          python -m unittest discover -s tests/unit -p '*_test.py' -v
          node --test tests/unit/*.test.mjs
      - name: Preserve test notes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-notes-${{ matrix.os }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
