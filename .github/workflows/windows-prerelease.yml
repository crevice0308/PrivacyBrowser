name: Explicit verified Windows development prerelease

on:
  workflow_run:
    workflows: [Code quality and cross-platform unit tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: privacybrowser-development-publication
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.repository == 'crevice0308/PrivacyBrowser' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.verify.outputs.ready }}
      bundle_id: ${{ steps.bundle.outputs.artifact-id }}
      bundle_sha256: ${{ steps.bundle.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Verify only an explicit reviewed request and its immutable candidate
        id: verify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PB_REQUEST_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python tools/windows_prerelease.py verify --commit "$PB_REQUEST_COMMIT" --output "$RUNNER_TEMP/approved-prerelease"
      - name: Preserve verified publication inputs without executing the candidate
        id: bundle
        if: steps.verify.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: approved-development-prerelease-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/approved-prerelease/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: needs.verify.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Create a new draft, verify every asset, and publish only as prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PB_REQUEST_COMMIT: ${{ github.event.workflow_run.head_sha }}
          PB_BUNDLE_ID: ${{ needs.verify.outputs.bundle_id }}
          PB_BUNDLE_SHA256: ${{ needs.verify.outputs.bundle_sha256 }}
        run: >-
          python tools/windows_prerelease.py publish --commit "$PB_REQUEST_COMMIT"
          --bundle-id "$PB_BUNDLE_ID" --bundle-sha256 "$PB_BUNDLE_SHA256"
