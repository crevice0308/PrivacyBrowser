name: Observe Firefox ESR security updates
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Save advisory update observation
        run: python tools/update_esr.py check --output reports/esr-observation.json
      - name: Highlight a version change
        run: |
          python - <<'PY'
          import json, os
          report = json.load(open('reports/esr-observation.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Configured ESR: ' + report['configured_version'] + '\n\n')
              summary.write('Observed ESR: ' + report['observed_version'] + '\n\n')
              summary.write('Update available: ' + str(report['update_available']) + '\n\n')
              summary.write('Observation only. No automatic unsigned release is published.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: esr-update-observation
          path: reports/esr-observation.json
          retention-days: 30
