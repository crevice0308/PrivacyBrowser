name: Branch-only unpublished Windows validation

# Authorized development validation only. This exact branch is never published.
# The main-only native and prerelease workflows remain unchanged.
on:
  push:
    branches: [codex/bound-windows-bootstrap]

permissions:
  contents: read

concurrency:
  group: privacybrowser-native-windows
  cancel-in-progress: false

jobs:
  quality:
    if: github.repository == 'crevice0308/PrivacyBrowser' && github.event_name == 'push' && github.ref == 'refs/heads/codex/bound-windows-bootstrap'
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned source-branding test dependency
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: --require-hashes -r requirements-build.txt
      - name: Parse Windows build and installer test scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem tools -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error -Message $_.Message -ErrorAction Continue }
              $failed = $true
            }
          }
          if ($failed) { throw 'PowerShell syntax validation failed.' }
      - name: Syntax and portable unit tests
        shell: bash
        run: |
          python tools/check_source.py
          python -m unittest discover -s tests/unit -p '*_test.py' -v
          node --test tests/unit/*.test.mjs
      - name: Preserve test notes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: branch-test-notes-${{ matrix.os }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  installer-safety:
    needs: quality
    if: github.repository == 'crevice0308/PrivacyBrowser' && github.event_name == 'push' && github.ref == 'refs/heads/codex/bound-windows-bootstrap'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out the exact quality-tested source for synthetic safety checks
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test only isolated synthetic NSIS safety functions before downloading Gecko
        shell: pwsh
        env:
          PB_EXPECTED_COMMIT: ${{ github.sha }}
          PB_QUALITY_RUN_ID: ${{ github.run_id }}
        run: python tools/run_windows_installer_safety.py
      - name: Preserve synthetic diagnostic text only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: installer-safety-diagnostics-${{ github.sha }}
          path: |
            D:/pb/evidence/*.json
            D:/pb/evidence/*.log
          if-no-files-found: ignore
          retention-days: 7

  build:
    needs: [quality, installer-safety]
    if: github.repository == 'crevice0308/PrivacyBrowser' && github.event_name == 'push' && github.ref == 'refs/heads/codex/bound-windows-bootstrap'
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: Check out exactly the revision whose quality tests passed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile, inspect, and smoke-test an unpublished native candidate
        shell: pwsh
        env:
          PB_EXPECTED_COMMIT: ${{ github.sha }}
        run: ./tools/build_windows_native.ps1
      - name: Preserve bounded build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-windows-diagnostics-${{ github.sha }}
          path: D:/pb/evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect only the successfully verified unpublished candidate
        # Never upload partial builds, Mozilla repacks, or developer overlays.
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNSIGNED-UNPUBLISHED-PrivacyBrowser-windows-${{ github.sha }}
          path: D:/pb/artifact/
          if-no-files-found: error
          retention-days: 7
      # Deliberately no GitHub Release or tag action. release_gate.py is unchanged.
