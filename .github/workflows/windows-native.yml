name: Unpublished native Windows source candidate

on:
  workflow_run:
    workflows: [Code quality and cross-platform unit tests]
    types: [completed]
    branches: [main]

# No publishing, signing, deployment, permission changes, or repository writes.
permissions:
  contents: read

concurrency:
  group: privacybrowser-native-windows
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build_required: ${{ steps.classify.outputs.build_required }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Skip native recompilation only for an isolated publication request
        id: classify
        env:
          PB_REQUEST_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: python3 tools/windows_prerelease.py classify --commit "$PB_REQUEST_COMMIT" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: >-
      needs.changes.outputs.build_required == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: windows-2025
    timeout-minutes: 360
    steps:
      - name: Check out exactly the revision whose quality tests passed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Compile, inspect, and smoke-test an unpublished native candidate
        shell: pwsh
        env:
          PB_EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: ./tools/build_windows_native.ps1
      - name: Preserve bounded build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-windows-diagnostics-${{ github.event.workflow_run.head_sha }}
          path: D:/pb/evidence/
          if-no-files-found: ignore
          retention-days: 7
      - name: Collect only the successfully verified unpublished candidate
        # Never upload partial builds, Mozilla repacks, or developer overlays.
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNSIGNED-UNPUBLISHED-PrivacyBrowser-windows-${{ github.event.workflow_run.head_sha }}
          path: D:/pb/artifact/
          if-no-files-found: error
          retention-days: 7
      # Deliberately no GitHub Release or tag action. release_gate.py is unchanged.
