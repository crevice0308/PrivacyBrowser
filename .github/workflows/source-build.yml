name: Unpublished full Gecko source build candidate
on:
  workflow_dispatch:
    inputs:
      esr_version:
        description: Stable ESR version; signed upstream archive is mandatory
        required: true
        default: '153.5.1esr'
      target:
        description: Target host (provisioned self-hosted runner required)
        type: choice
        options: [linux, windows]
        default: linux
      acknowledge:
        description: 'I understand this is an unpublished unsigned build candidate'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: privacybrowser-source-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  build:
    if: inputs.acknowledge == true
    # Gecko builds need provisioned Mozilla toolchains and substantial disk/RAM.
    # Windows runner: MozillaBuild bash, VS Build Tools, rustup, Python, GPG.
    # Linux runner: Mozilla build dependencies, Python, Rust, Clang, GPG.
    runs-on: [self-hosted, privacybrowser-build, '${{ inputs.target }}']
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Provision pinned Mozilla public key
        shell: bash
        run: python tools/provision_upstream_key.py --output upstream/mozilla-release.gpg
      - name: Obtain and verify exact ESR source
        shell: bash
        env:
          ESR_VERSION: ${{ inputs.esr_version }}
        run: |
          python tools/update_esr.py fetch --version "$ESR_VERSION" --kind source --destination upstream --keyring upstream/mozilla-release.gpg --fingerprint 14F26682D0916CDD81E37B6D61B7B526D98F0353 --signing-fingerprint 827E658608679618CD349F93678E455D76767AA3
          python tools/extract_source.py --archive "upstream/firefox-$ESR_VERSION.source.tar.xz" --verification "upstream/firefox-$ESR_VERSION.source.tar.xz.verification.json" --destination upstream/source
      - name: Apply source integration and independent branding
        shell: bash
        env:
          ESR_VERSION: ${{ inputs.esr_version }}
          TARGET_OS: ${{ inputs.target }}
        run: |
          python tools/prepare_source.py --source upstream/source --target "$TARGET_OS"
      - name: Compile Gecko, build native package and run upstream unit smoke tests
        shell: bash
        env:
          ESR_VERSION: ${{ inputs.esr_version }}
        run: |
          cd upstream/source
          ./mach build
          ./mach package
          ./mach xpcshell-test toolkit/components/places/tests/unit/
      - name: Collect unpublished candidate build artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: UNSIGNED-UNPUBLISHED-source-build-${{ inputs.target }}
          path: |
            upstream/source/obj-privacybrowser/dist/*.tar.xz
            upstream/source/obj-privacybrowser/dist/*.zip
            upstream/source/obj-privacybrowser/dist/install/sea/*.exe
            upstream/source/PRIVACY_BROWSER_SOURCE_PREPARATION.json
          if-no-files-found: warn
          retention-days: 7
      # No publication action exists. Signed updates and release deployment are
      # intentionally blocked until the required external identities and tests exist.
